# Mosquitto broker — DriverSafe-IoT, mạng demo nội bộ (spec §L1 / §5)
#
# Chạy:  "C:\Program Files\mosquitto\mosquitto.exe" -c mqtt\mosquitto.conf -v
#
# LƯU Ý: service "mosquitto" cài kèm bản Windows dùng config MẶC ĐỊNH của nó
# (chỉ listen 127.0.0.1) — ESP32-S3 của Phần A KHÔNG connect được vào đó.
# Muốn A kết nối qua WiFi: stop service rồi chạy broker bằng chính file này:
#     sc stop mosquitto
#     "C:\Program Files\mosquitto\mosquitto.exe" -c <repo>\mqtt\mosquitto.conf -v

listener 1883 0.0.0.0
allow_anonymous true

# Persist retained message (ds/fusion/level) qua restart broker
persistence true
persistence_location mqtt/

log_dest file mqtt/mosquitto.log
log_type warning
log_type error
log_type notice
